# ============================================================================
# rx26_uav — SINGLE SOURCE OF TRUTH for all ROS-side parameters.
#
# Standard ROS 2 parameter-file format: passed to launch via
#     parameters=[os.path.join(pkg_share, "config", "uav_params.yaml")]
# or per-node:  ros2 run ... --ros-args --params-file config/uav_params.yaml
#
# Node code loads THIS file for its declaration defaults (uav_common/config.py),
# so a code default can never drift from the file the launch system loads.
#
# Parameter posture (enforced in code via ParameterDescriptor):
#   [RO] read_only — safety/structural; `ros2 param set` is REJECTED; change
#        here + restart the node (rebuild NOT required, params load at start).
#   [DYN] dynamic — accepted at runtime via `ros2 param set`, range-validated.
#
# ---------------------------------------------------------------------------
# TWO HARD FORMAT RULES — rcl's parser is stricter than PyYAML. Break either and
# EVERY node in the launch dies at rclpy.init() with "Couldn't parse params
# file", before a single line of node code runs (this grounded the whole ASV
# stack on 2026-07-29):
#
#   1. NO YAML anchors/aliases (&name / *name). rcl_yaml_param_parser rejects
#      them outright — it is a token-level parser, not a YAML document loader.
#      Values that MUST stay equal across sections are therefore written out
#      LITERALLY and pinned by tools/scripts/check_config.py instead. If you
#      change one, change every copy the check names.
#   2. EVERY top-level key must be a node name whose only child is
#      `ros__parameters:`. A bare scalar at top level produces "Cannot have a
#      value before ros__parameters". That is why the `shared` block below —
#      which is documentation, not a real node — still carries a
#      `ros__parameters:` level: no node is named `shared`, so rcl parses the
#      section, matches it to nothing, and ignores it.
#
# Do not "tidy" this file back into anchors.
# ============================================================================

# Canonical values for anything duplicated below. NOT a real node (see rule 2).
shared:
  ros__parameters:
    # Age at which a /uav/pose sample stops being usable. telemetry_bridge uses
    # it to decide when to STOP republishing a dead MAVLink stream; ocs_client
    # uses the same number to decide when to stop reporting. One value, because
    # a consumer trusting a pose for longer than the bridge vouches for it is
    # exactly the frozen-pose failure this guards against.
    pose_timeout_s: 1.0

    # The competition geofence, CLOSED (last pair == first pair).
    #
    # FLAT [lat, lon, lat, lon, ...], NOT a list of pairs. ROS 2 parameters
    # cannot nest: rclpy accepts scalars and homogeneous FLAT arrays only, and a
    # list of pairs is rejected at declare_parameter() with "The given value is
    # not a list of one of the allowed types" — which kills the node before any
    # of its code runs. uav_common.fence_core.polygon_from_flat is the single
    # place that pairs them back up. Do NOT re-nest this; it will not load.
    #
    # The OCS's bridge.toml nests its copy, because TOML has no such
    # restriction and that file is read by a plain Python program rather than by
    # rcl. Same polygon, two spellings; check_config.py compares across them.
    #
    # THIS MUST EQUAL `uav_geofence` IN THE OCS bridge.toml, vertex for vertex.
    # The OCS declares this polygon to RoboNation and the autopilot enforces it;
    # if the two disagree, we are flying a different box than we declared. It is
    # duplicated into both node sections below (rcl forbids anchors) and
    # tools/scripts/check_config.py pins all three copies together.
    #
    # RoboNation's test_server REJECTS a declaration outright when a vehicle id
    # starts with "UAV" and the fence has fewer than 4 points, so a wrong fence
    # here fails a RUN, not just a flight.
    #
    # PLACEHOLDER, but at the right venue: a ~200 m box around the Singapore
    # course corners their test_server publishes (1.2803, 103.8557). NOT the
    # competition geofence. Replace before the competition, in BOTH repos.
    geofence:
      # lat,  lon,          lat,  lon,  ...  CLOSED (last pair == first)
      - 1.28010
      - 103.85520
      - 1.28010
      - 103.85625
      - 1.28110
      - 103.85625
      - 1.28110
      - 103.85520
      - 1.28010
      - 103.85520

    # HAE = AMSL + this. GLOBAL_POSITION_INT.alt is height above MEAN SEA LEVEL;
    # RoboNation's Heartbeat.altitude_hae_m wants height above the WGS84
    # ELLIPSOID. The difference is the geoid separation: tens of metres, and
    # venue-specific.
    #
    # -24.6 is SARASOTA (what rx26_ocs/fake_vehicle.py uses). Singapore is
    # different. MUST BE CHECKED AGAINST THE ACTUAL COURSE before the
    # competition — this is the kind of constant that is silently wrong by tens
    # of metres and nothing downstream will complain.
    geoid_separation_m: -24.6

telemetry_bridge:
  ros__parameters:
    mav_endpoint: "udp:127.0.0.1:14541"    # [RO] MAVProxy rebroadcast, never
                                           #      serial. 14541, NOT the ASV's
                                           #      14551 — the two vehicles share
                                           #      a subnet; see README ports.
    mav_source_system: 200                 # [RO] our MAVLink sysid. MUST differ
                                           #      from MAVProxy's 255 or the
                                           #      geofence upload's
                                           #      MISSION_REQUEST_INT replies
                                           #      are ambiguous between us.
    drop_channel: 7                        # [RO] autonomy-drop RC channel (1..18)
    drop_threshold: 1700                   # [RO] us; crossing trips the latch
    drop_invert: false                     # [RO]
    rc_stale_timeout: 1.0                  # [RO] s without RC -> trip
    stream_timeout_s: 1.0                  # [RO] = shared.pose_timeout_s; s
                                           #      before a stale MAVLink stream
                                           #      stops being republished
    fence_timeout_s: 5.0                   # [RO] per-exchange timeout in the
                                           #      fence mission dialog
    geofence:                              # [RO] = shared.geofence (pinned by
                                           #      check_config.py). CLOSED ring;
                                           #      the closing point is stripped
                                           #      on upload because ArduPilot
                                           #      closes polygons implicitly.
      # lat,  lon,          lat,  lon,  ...  CLOSED (last pair == first)
      - 1.28010
      - 103.85520
      - 1.28010
      - 103.85625
      - 1.28110
      - 103.85625
      - 1.28110
      - 103.85520
      - 1.28010
      - 103.85520

ocs_client:
  ros__parameters:
    ocs_host: "192.168.8.107"              # [RO] the OCS laptop on the TEAM
                                           #      subnet, over WiFi. There is NO
                                           #      discovery: give it a DHCP
                                           #      reservation on the team router
                                           #      and set this to match.
                                           #      NOT 127.0.0.1 — that is this
                                           #      Jetson, and the connect fails.
    ocs_port: 37564                        # [RO] = [tcp] port in the OCS
                                           #      bridge.toml. Clear of 8090
                                           #      (ground_station).
    vehicle_id: "UAV1"                     # [RO] MUST match a [[vehicle]] id in
                                           #      the OCS bridge.toml, or the
                                           #      OCS drops every frame with
                                           #      "not a configured vehicle"
    team_id: "ASTA"                        # [RO] = bridge.toml team_id
    rate_hz: 2.0                           # [RO] the handbook mandates 2 Hz per
                                           #      active vehicle; the OCS rate
                                           #      governor reserves budget for it
    fake_telemetry: false                  # [RO] true = invent a circle instead
                                           #      of subscribing, for bench work
                                           #      with no Pixhawk. Logs a warning
                                           #      the whole time it is on. NEVER
                                           #      leave true for a scored run.
    geoid_separation_m: -24.6              # [RO] = shared.geoid_separation_m.
                                           #      VENUE-SPECIFIC — see above.
    airborne_alt_m: 1.0                    # [RO] fallback airborne threshold on
                                           #      altitude_rel. Used ONLY when
                                           #      EXTENDED_SYS_STATE is absent;
                                           #      the autopilot's own landed
                                           #      state wins whenever it is
                                           #      fresh. Raise SR0_EXT_STAT
                                           #      rather than tuning this.
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s; stale
                                           #      -> NO heartbeat, rather than a
                                           #      fabricated position
    attitude_timeout_s: 1.0                # [RO] stale -> roll/pitch omitted,
                                           #      the rest still goes
    status_timeout_s: 1.0                  # [RO] stale -> no heartbeat at all,
                                           #      since state cannot be known
    flight_timeout_s: 1.0                  # [RO] stale -> fall back to
                                           #      armed+altitude, loudly

ground_station:
  ros__parameters:
    port: 8090                             # [RO] HTTP port
    bind_host: "0.0.0.0"                   # [RO] must NOT be 127.0.0.1 or the
                                           #      laptop cannot reach it
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s
    attitude_timeout_s: 1.0                # [RO] stale -> attitude readout greys
    status_timeout_s: 1.0                  # [RO] mode/armed readout. ALSO the
                                           #      power interlock: an UNKNOWN
                                           #      armed state locks power,
                                           #      because a missing FcuStatus
                                           #      usually means the bridge is
                                           #      down, which is not evidence
                                           #      the aircraft is safe to reboot.
    flight_timeout_s: 1.0                  # [RO] stale -> landed-state greys
    poll_period_s: 0.2                     # [RO] browser -> /state
    graph_period_s: 1.0                    # [DYN] how often the ROS node graph
                                           #       is scanned. Once per browser
                                           #       poll per client would put
                                           #       discovery traffic on the wire
                                           #       in proportion to viewers.
    trail_length: 600                      # [DYN] track points kept
    trail_min_move_m: 0.5                  # [DYN] distance-gated, not
                                           #       time-gated: a time gate
                                           #       saturates the trail while the
                                           #       aircraft sits still
    log_capacity: 1500                     # [RO] /rosout lines kept in the ring.
                                           #      Bounded because a node in a
                                           #      failure loop emits thousands a
                                           #      minute, and running the Jetson
                                           #      out of memory during exactly
                                           #      that failure helps nobody.
    tools_dir: "/root/robotx_ws/src/rx26_uav/tools"   # [RO] where tools/*.py
                                           #      live INSIDE the container
    power_request_dir: "/root/robotx_ws/logs"  # [RO] where shutdown.request
                                           #      and reboot.request are
                                           #      dropped. A container CANNOT
                                           #      power off the Jetson on its
                                           #      own, so it asks with a file
                                           #      the host's .path units watch
                                           #      for. Rides the workspace
                                           #      bind mount — no extra mount,
                                           #      no socket, no daemon.
    allow_power: true                      # [RO] master switch for the power
                                           #      tab. FALSE by default: the
                                           #      host-side .path units must
                                           #      be installed first, and a
                                           #      button that silently does
                                           #      nothing is worse than one
                                           #      that is openly off. Flip to
                                           #      true once uav-shutdown.path
                                           #      and uav-reboot.path are
                                           #      enabled and you have decided
                                           #      a browser may halt this
                                           #      Jetson.
    disk_path: "/"                         # [RO] filesystem reported as free.
                                           #      Inside a container this is the
                                           #      CONTAINER's view, so the tab
                                           #      prints the path it measured.
    workspace_path: "/root/robotx_ws"      # [RO] checked at startup for being a
                                           #      BIND MOUNT. If it is not, a
                                           #      `git pull` on the host is
                                           #      invisible in here and a
                                           #      rebuild silently changes
                                           #      nothing — see the System tab.
    geofence:                              # [RO] = shared.geofence (pinned by
                                           #      check_config.py). Drawn on the
                                           #      Map tab, so the operator sees
                                           #      the polygon that was uploaded
                                           #      rather than a second copy that
                                           #      can drift.
      # lat,  lon,          lat,  lon,  ...  CLOSED (last pair == first)
      - 1.28010
      - 103.85520
      - 1.28010
      - 103.85625
      - 1.28110
      - 103.85625
      - 1.28110
      - 103.85520
      - 1.28010
      - 103.85520

camera_node:
  ros__parameters:
    rtsp_url: "rtsp://192.168.144.25:8554/main.264"
                                           # [RO] the camera's MAIN stream.
                                           #      NOT the SIYI proprietary UDP
                                           #      protocol that UniGCS uses on
                                           #      the same port — GStreamer does
                                           #      not speak that one.
                                           #      A8 mini uses the OLD address
                                           #      scheme (main.264 / sub.264);
                                           #      ZT30 and later use video1 /
                                           #      video2. Manual v1.10 p63.
    rtsp_codec: "h264"                     # [RO] MUST match what the camera
                                           #      is actually SERVING. This is
                                           #      not a preference: set it
                                           #      wrong and the stream decodes
                                           #      to PURE WHITE while stream_ok
                                           #      and fps both look healthy.
                                           #      Change it in the SAME step as
                                           #      the camera's own encoding
                                           #      (cmd 0x21, stream_type 1).
                                           #      h265 at the camera's ~1.5
                                           #      Mbps ceiling carries roughly
                                           #      what h264 needs 2.5-3 Mbps
                                           #      for; that headroom is the
                                           #      whole reason it is set here.
    rtsp_latency_ms: 0                     # [RO] rtspsrc jitter buffer. 0 on a
                                           #      wired link; raise only if the
                                           #      stream tears.
    want_frames: true                      # [RO] build the decode branch. false
                                           #      = record-only sortie at almost
                                           #      no CPU, for data collection.
    preview_fps: 5                         # [RO] operator view rate. NOT the
                                           #      record rate — the file gets
                                           #      every frame regardless.
    stills_enabled: true                   # [RO] also write JPEG stills to
                                           #      <session>_stills/, named by
                                           #      frame_idx so they join
                                           #      straight to _frames.csv.
                                           #      A SECOND record path on
                                           #      purpose: matroska is only
                                           #      readable once EOS reaches the
                                           #      muxer, and this directory
                                           #      already holds 0-byte .mkv
                                           #      files from unclean stops. A
                                           #      JPEG is complete when written.
                                           #      These do NOT improve colour —
                                           #      the camera encodes H.264 4:2:0
                                           #      upstream, so chroma is already
                                           #      halved before the Jetson
                                           #      decodes it. For colour, use
                                           #      the camera's own 4K SD
                                           #      recording or fly lower.
                                           #      Needs cv2 + numpy; without
                                           #      them the node logs an error
                                           #      and carries on without stills.
    stills_hz: 2.0                         # [RO] stills per second, NOT the
                                           #      video rate. 2 Hz because
                                           #      consecutive frames at 25 fps
                                           #      are near-duplicates: they
                                           #      inflate a dataset without
                                           #      adding information, and every
                                           #      one of them costs a human a
                                           #      labelling decision.
    stills_quality: 95                     # [RO] JPEG quality. Well above the
                                           #      viewer's 70: this is training
                                           #      data, and the artefacts of a
                                           #      cheap encode look exactly like
                                           #      real image features to a
                                           #      detector.
    mjpeg_port: 8091                       # [RO] viewer port. MUST differ from
                                           #      ground_station.port (8090) and
                                           #      ocs_client.ocs_port (37564);
                                           #      check_config.py enforces it.
                                           #      Clear of the aircraft's 1454x
                                           #      range.
    bind_host: "0.0.0.0"                   # [RO] must NOT be 127.0.0.1 or the
                                           #      laptop cannot reach the viewer
    siyi_enabled: true                     # [RO] false = stream and record with
                                           #      no gimbal control and no SD
                                           #      recording. For a bench with no
                                           #      siyi_sdk installed.
    siyi_ip: "192.168.144.25"              # [RO] gimbal SDK address; same device
                                           #      as the RTSP stream, different
                                           #      protocol and port.
    siyi_port: 37260                       # [RO] gimbal SDK UDP port
    gimbal_pitch_deg: -90.0                # [RO] pitch commanded at startup =
                                           #   NADIR. THE SIGN IS UNIT-SPECIFIC.
                                           #   SIYI documents -90 as full-down.
                                           #   CONFIRMED ON EKKO 2026-09-02:
                                           #   -90 IS nadir on this unit. The
                                           #   camera was observed by eye aimed
                                           #   at the ground while
                                           #   /uav/camera/status reported
                                           #   gimbal_pitch -89.9.
                                           #   An EARLIER COMMENT HERE CLAIMED
                                           #   -90 AIMED AT THE SKY AND +90 WAS
                                           #   NADIR. That was measured on a
                                           #   DIFFERENT airframe (Fitz) and is
                                           #   WRONG for Ekko — do not "restore"
                                           #   it. Re-measure with
                                           #   tools/siyi_gimbal.py on any new
                                           #   unit before trusting either sign:
                                           #   a camera that films the clouds
                                           #   for a whole sortie looks exactly
                                           #   like one that works.
    gimbal_control_enabled: true           # [RO] create the
                                           #   /uav/camera/gimbal_cmd
                                           #   subscription. TRUE HERE: Ekko is
                                           #   the development airframe and the
                                           #   camera gets re-aimed by hand
                                           #   often enough that not being able
                                           #   to costs more than the surface
                                           #   does. Know what it opens — DDS
                                           #   is not local-only, so anything
                                           #   on the vehicle's ROS graph,
                                           #   including anything that reaches
                                           #   it over the field WiFi, can
                                           #   publish an arbitrary angle to
                                           #   this topic. Set it false to shut
                                           #   that path off; the node still
                                           #   commands nadir at startup and
                                           #   /uav/camera/set_nadir still
                                           #   works, because that service can
                                           #   only ever send the one angle
                                           #   below and cannot aim the camera
                                           #   anywhere new.
    gimbal_renadir_after_s: 15.0           # [RO] seconds of gimbal_cmd silence
                                           #   before the camera is put back to
                                           #   gimbal_pitch_deg. 0 disables.
                                           #   THE GIMBAL IS POWERED BY THE
                                           #   AIRCRAFT, not the Jetson: a
                                           #   battery swap or an autopilot
                                           #   reboot power-cycles it and the
                                           #   A8 mini returns at 0 deg -- the
                                           #   HORIZON -- while this node keeps
                                           #   running and never re-sends its
                                           #   startup nadir command. Ekko flew
                                           #   a whole sortie that way on
                                           #   2026-09-02 with gimbal_ok true
                                           #   and nothing in any log to say
                                           #   the footage was worthless.
                                           #   Nadir is the RESTING STATE here,
                                           #   not a startup event; a hand-aimed
                                           #   angle simply expires after this
                                           #   long. Raise it if you need to
                                           #   hold an off-nadir aim for longer.
    gimbal_nadir_tol_deg: 3.0              # [RO] how far off nadir counts as
                                           #   off. Above the gimbal's own
                                           #   settling jitter so a stationary
                                           #   camera is never re-commanded,
                                           #   well below the ~90 deg error a
                                           #   power cycle produces.
    record_dir: "/root/robotx_ws/logs/video"
                                           # [RO] rides the workspace bind mount
                                           #      on purpose: a path inside the
                                           #      container's own filesystem
                                           #      vanishes with the container,
                                           #      taking the sortie with it.
    record_on_start: true                  # [RO] begin a session as soon as
                                           #      frames flow. There is no
                                           #      operator action on this
                                           #      aircraft to press record with,
                                           #      and an unrecorded flight is a
                                           #      flight flown twice.
    record_sd: true                        # [RO] MAY the node drive the camera's
                                           #      own SD recording at all. This
                                           #      is the master enable, not the
                                           #      switch — see
                                           #      record_sd_on_start below.
                                           #      That recording is 3840x2160
                                           #      H264 at 20 Mbps; the Jetson
                                           #      stream is 1080p. The two paths
                                           #      fail independently, which is
                                           #      why both exist.
    capture_on_start: false                # [RO] begin CAPTURE the moment
                                           #      a session opens. FALSE, which
                                           #      is a change from the original
                                           #      always-on behaviour: 4K at
                                           #      20 Mbps is ~9 GB/hour, and the
                                           #      camera was filling its card
                                           #      with footage of the bench
                                           #      whenever the aircraft was
                                           #      powered.
                                           #      CAPTURE = the camera's 4K SD
                                           #      recording AND the JPEG stills,
                                           #      the two things that cost real
                                           #      storage (~9 and ~0.9 GB/hour).
                                           #      Turn it on for a sortie with
                                           #      the capture button on the
                                           #      ground station's Camera tab,
                                           #      which calls
                                           #      /uav/camera/capture.
                                           #      The Jetson's own .mkv is NOT
                                           #      gated by this — it is small
                                           #      and it carries the geotagged
                                           #      frame index, so it always runs.
    min_free_mb: 1024.0                    # [RO] stop recording above this
                                           #      floor. Not zero: the muxer
                                           #      still has to write the
                                           #      matroska index, and a file
                                           #      whose index never landed may
                                           #      not open at all.
    max_session_s: 600.0                   # [RO] roll to a new session every
                                           #      10 min; 0 disables. Bounds
                                           #      what a crash costs to one
                                           #      segment rather than the
                                           #      sortie.
    frame_timeout_s: 2.0                   # [RO] s without a frame before the
                                           #      stream is reported down. Well
                                           #      above one frame interval so a
                                           #      hiccup is not a dropout.
    pose_timeout_s: 1.0                    # [RO] = shared.pose_timeout_s (pinned
                                           #      by check_config.py). Older than
                                           #      this and the frame index writes
                                           #      BLANKS rather than a stale
                                           #      position — a blank is a fact, a
                                           #      back-filled coordinate is a
                                           #      guess that looks like a
                                           #      measurement.
    attitude_timeout_s: 1.0                # [RO] attitude goes stale
                                           #      independently of pose; they
                                           #      arrive on separate MAVLink
                                           #      streams with separate rate
                                           #      groups.
    gimbal_timeout_s: 3.0                  # [RO] s without an answer from the
                                           #      gimbal before gimbal_ok goes
                                           #      false and gimbal_pitch goes
                                           #      NaN. Deliberately several
                                           #      status ticks wide: one lost
                                           #      UDP datagram is not a dead
                                           #      gimbal, but a gimbal that has
                                           #      genuinely stopped answering
                                           #      must NOT keep publishing its
                                           #      last angle as if it were
                                           #      current — geo-projection uses
                                           #      that angle, and a frozen one
                                           #      is wrong by
                                           #      altitude*tan(error) with
                                           #      nothing to show for it.
    status_rate_hz: 2.0                    # [RO] /uav/camera/status rate. A
                                           #      heartbeat about the pipeline,
                                           #      not a per-frame record.
    gimbal_poll_hz: 10.0                   # [RO] gimbal attitude asks per
                                           #      second, on their own thread.
                                           #      Sets how old the gimbal yaw
                                           #      written beside each frame can
                                           #      be: at 10 Hz, <= 100 ms. In
                                           #      follow mode the gimbal trails
                                           #      a fast yaw, and buoy_mapper
                                           #      needs where the camera WAS
                                           #      pointing, not where the nose
                                           #      is. Each ask blocks at most
                                           #      0.25 s (ATTITUDE_TIMEOUT_S).

detector_node:
  ros__parameters:
    # The trained buoy detector, and the operator's view of it. This node owns
    # NO device: it consumes the MJPEG stream camera_node already serves, so a
    # detector that crashes or fills the GPU cannot stop the recording.
    model_path: "/root/robotx_ws/models/ekko_colour_yolo26n.pt"
                                           # [RO] YOLO26n, FOUR classes read
                                           #      from the weights (blue, dark,
                                           #      green, red), imgsz 1920,
                                           #      trained 12-13 Sep 2026 on the
                                           #      12 Sep park flights and chosen
                                           #      over YOLO11n on a time-split
                                           #      validation set. The class is
                                           #      per FRAME: buoy_mapper decides
                                           #      each buoy's state over time.
                                           #      The one-class buoy_yolo11n_v1
                                           #      is still in models/.
                                           #      A TensorRT .engine goes here
                                           #      too — but engines are built on
                                           #      THIS device and are not
                                           #      portable between Jetsons or
                                           #      TensorRT versions.
    source_url: "http://127.0.0.1:8091/stream.mjpg"
                                           # [RO] camera_node's viewer, NOT the
                                           #      camera. A second RTSP client
                                           #      on the A8 mini is the failure
                                           #      node_registry's exclusive tag
                                           #      exists to prevent. Loopback
                                           #      because both run in the same
                                           #      host-network container.
    mjpeg_port: 8092                       # [RO] this node's annotated view.
                                           #      MUST differ from
                                           #      camera_node.mjpeg_port (8091)
                                           #      and ground_station.port
                                           #      (8090). The Camera tab
                                           #      switches its <img> between
                                           #      8091 and this.
    bind_host: "0.0.0.0"                   # [RO] must NOT be 127.0.0.1 or the
                                           #      view is unreachable from the
                                           #      laptop.
    infer_hz: 4.0                          # [RO] DELIBERATELY LOW. Inference
                                           #      shares the GPU with
                                           #      camera_node's hardware
                                           #      decoder, and that decoder
                                           #      feeds the recording. Measured
                                           #      8.1 fps at imgsz 1920 with
                                           #      nothing else running, so 4 Hz
                                           #      leaves real headroom. Raise it
                                           #      only after checking the frame
                                           #      index for drops.
                                           #      ALSO the colour sample rate:
                                           #      4 Hz over buoy_mapper's 4 s
                                           #      watch is 16 samples of a 1 s
                                           #      on / 1 s off flash. Do not go
                                           #      below 2 Hz (Nyquist for that
                                           #      flash) or FLASHING and SOLID
                                           #      stop being separable.
    imgsz: 1920                            # [RO] native. A 0.46 m buoy at 20 m
                                           #      is 26 px here, 17 px at 1280
                                           #      and 8.7 px at the 640 default
                                           #      — below what YOLO detects
                                           #      reliably. Smaller loses the
                                           #      buoy before it saves time.
    conf: 0.25                             # [RO] confidence floor. Low on
                                           #      purpose for a viewer: seeing
                                           #      a weak detection is
                                           #      informative, and nothing acts
                                           #      on it.
    edge_margin_px: 12                     # [RO] a box within this many px of
                                           #      the frame border is a CLIPPED
                                           #      buoy: drawn grey, published
                                           #      with full_view=false, never
                                           #      mapped. A clipped buoy usually
                                           #      has its beacon out of frame
                                           #      (so it reads "dark"), and a
                                           #      clipped box's centre is not
                                           #      the buoy's centre.
    reconnect_s: 3.0                       # [RO] wait before retrying a dropped
                                           #      source. camera_node restarts
                                           #      take a few seconds to rebind.

buoy_mapper:
  ros__parameters:
    # Detections -> the Task 1 buoy map: where each buoy is and which of the
    # five states it shows. NOTHING HERE IS A FLIGHT-TIME KNOB: every value is
    # read-only, and the geometry ones are MEASURED once. If a map comes out
    # wrong, replay the sightings log with tools/scripts/map_session.py and fix
    # the constant after landing.

    # ---- geometry (uav_perception/geolocate.py)
    hfov_deg: 81.0                         # [RO] MEASURED 3 Sep 2026 from a
                                           #      6.0 m buoy baseline at three
                                           #      altitudes: f = 750 px at 1280
                                           #      wide, 1130 px at 1920. Focal
                                           #      length is derived from each
                                           #      frame's width, so a stream
                                           #      that falls back to 720p stays
                                           #      correct.
    nadir_pitch_deg: -90.0                 # [RO] = camera_node.gimbal_pitch_deg
    max_off_nadir_deg: 8.0                 # [RO] frames with the MEASURED
                                           #      gimbal pitch further from
                                           #      nadir than this are not
                                           #      mapped: a camera still slewing
                                           #      back after a power cycle.
    gimbal_yaw_mode: "body"                # [RO] what the gimbal's yaw is
                                           #      measured against. "body" =
                                           #      relative to the airframe
                                           #      (SIYI follow mode, expected),
                                           #      "earth" = already a compass
                                           #      heading, "aircraft" = ignore
                                           #      the gimbal and use the nose.
                                           #      MEASURED 2026-09-13 on the
                                           #      bench: airframe turned 90 deg
                                           #      by hand, gimbal_yaw peaked at
                                           #      24.6 (follow lag), then decayed
                                           #      back to its 0.3 baseline while
                                           #      heading sat at 255.9. Returning
                                           #      to baseline = body. In earth
                                           #      mode it would have parked ~90
                                           #      off baseline and STAYED there.
    gimbal_yaw_sign: -1.0                  # [RO] +1 or -1: which way positive
                                           #      gimbal yaw turns on THIS unit.
                                           #      MEASURED 2026-09-13: turning
                                           #      the camera CLOCKWISE seen from
                                           #      above drove gimbal_yaw to -52,
                                           #      so clockwise = DOWN = -1.
                                           #      The 1.0 that stood here was a
                                           #      guess and it was WRONG. A wrong
                                           #      sign does not shift buoys, it
                                           #      MIRRORS every off-nadir one to
                                           #      the opposite side -- which at
                                           #      3 m gate spacing reads as
                                           #      plausible noise, not a fault.
    mount_yaw_offset_deg: 0.0              # [RO] angle between the gimbal's yaw
                                           #      zero and the nose. NOT MEASURED
                                           #      BY TAPE. Set 0.0 on 2026-09-13
                                           #      from two weak agreeing checks:
                                           #      the camera eyeballed square to
                                           #      the frame, and gimbal_yaw
                                           #      resting at 0.0-0.3.
                                           #
                                           #      NOT A FIXED MOUNT CONSTANT,
                                           #      despite the name. It was a
                                           #      genuine ~20 right on 09-11 and
                                           #      0 on 09-13 with NO remount in
                                           #      between, so the gimbal's yaw
                                           #      zero moves across power cycles
                                           #      the way pitch does. CHECK IT
                                           #      BEFORE EVERY FLIGHT, not once
                                           #      on the bench. A stale value
                                           #      here is worse than none: it
                                           #      looks measured.
                                           #
                                           #      Tape method: line along the
                                           #      nose-tail axis under the nadir
                                           #      camera. Nose end leaning LEFT
                                           #      of image-up by t = camera
                                           #      looking t RIGHT of the nose
                                           #      (d = +t). Then this =
                                           #      d - sign*gimbal_yaw read at
                                           #      that moment. Steps in the
                                           #      field-day skill. The replay
                                           #      tool's --solve-yaw is a
                                           #      cross-check only: GPS wander
                                           #      swamps a few degrees.
    launch_height_above_surface_m: 0.0     # [RO] how far HOME sits above the
                                           #      surface the buoys float on.
                                           #      altitude_rel is above home, so
                                           #      launching from a 1.5 m dock
                                           #      puts every height 1.5 m short
                                           #      without this. 0 on grass.
                                           #      SET PER VENUE.
    target_height_m: 0.45                  # [RO] height of the buoy TOP (what
                                           #      the box outlines) above that
                                           #      surface. ESTIMATE from the
                                           #      RoboBuoy build guide, not
                                           #      measured. At 10 m a 0.1 m
                                           #      error moves an edge-of-frame
                                           #      buoy about 5 cm.
    min_alt_m: 3.0                         # [RO] no mapping below this: take-
                                           #      off and landing, where buoys
                                           #      are huge and clipped and the
                                           #      barometer is least reliable.
                                           #
                                           # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
                                           # !!! TEMPORARY -- NOT FLIGHTWORTHY
                                           # !!! REAL VALUE IS 3.0
                                           # !!!
                                           # !!! Lowered to 1.0 on 2026-09-13
                                           # !!! ONLY for a hand-held bench test
                                           # !!! at ~2 m over buoys on a lawn.
                                           # !!! MUST be restored to 3.0 before
                                           # !!! ANY flight. Flying with 1.0
                                           # !!! feeds takeoff and landing
                                           # !!! frames into the map -- buoys
                                           # !!! huge, clipped, and placed off
                                           # !!! a barometer reading at its
                                           # !!! least reliable -- which lands
                                           # !!! junk tracks near HOME that look
                                           # !!! like real buoys.
                                           # !!!
                                           # !!! Floor is not arbitrary: surface
                                           # !!! height = alt_rel - 0.45, so
                                           # !!! below ~0.5 m the geometry
                                           # !!! inverts and nothing projects.
                                           # !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
    max_pose_age_s: 0.5                    # [RO] a frame whose pose was older
                                           #      than this is not mapped. At
                                           #      1.5 m/s, 0.5 s is 0.75 m.
    max_gimbal_age_s: 0.5                  # [RO] same, for the gimbal reading.
    max_gimbal_yaw_rate_dps: 20.0          # [RO] the camera turning faster
                                           #      than this = not mapped; its
                                           #      heading moved between the
                                           #      frame and its gimbal sample.

    # ---- which buoy, and which state (uav_perception/buoy_tracker.py)
    min_conf: 0.35                         # [RO] detections below this are not
                                           #      mapped. Higher than the
                                           #      viewer's 0.25: a weak box is
                                           #      worth SEEING, not navigating
                                           #      by.
    assoc_radius_m: 1.5                    # [RO] a sighting this close to a
                                           #      known buoy IS that buoy. Half
                                           #      the 3 m Task 1 gate spacing
                                           #      RoboNation confirmed, so two
                                           #      gate buoys are never merged.
    merge_radius_m: 1.0                    # [RO] two buoys whose averages come
                                           #      this close are one buoy first
                                           #      seen from the frame edge.
    min_sightings: 3                       # [RO] before a buoy appears at all,
                                           #      so one stray box -- a bag, a
                                           #      person -- never becomes a pin.
    min_observe_s: 4.0                     # [RO] FULL-VIEW watch time before a
                                           #      state is decided: two whole
                                           #      2 s flash periods. Partial
                                           #      views do not count.
    min_samples: 12                        # [RO] and at least this many
                                           #      full-view colour samples (4 Hz
                                           #      inference gives ~16 in 4 s).
    max_sample_gap_s: 1.0                  # [RO] gaps longer than this (flew
                                           #      away, came back) add no watch
                                           #      time.
    solid_min_lit: 0.85                    # [RO] lit in >= 85% of samples =
                                           #      SOLID. Room for the model
                                           #      occasionally calling a lit
                                           #      beacon dark.
    off_max_lit: 0.15                      # [RO] lit in <= 15% = OFF.
    min_flash_transitions: 2               # [RO] between those, FLASHING needs
                                           #      at least this many lit/dark
                                           #      changes. Without them the buoy
                                           #      was on and then off: a change
                                           #      of state, not a flash.
    min_colour_agreement: 0.6              # [RO] share of lit samples that must
                                           #      agree on the colour, or the
                                           #      state stays UNKNOWN.
    lock_state: true                       # [RO] freeze each state once
                                           #      decided. TRUE for Advanced
                                           #      tier, where the passage does
                                           #      not change. Disruptive: false.

    # ---- output
    map_rate_hz: 1.0                       # [RO] /uav/perception/buoy_map, the
                                           #      WHOLE map every time -- never
                                           #      deltas, per the Task 1 design.
    export_dir: "/root/robotx_ws/logs/buoy_maps"
                                           # [RO] sightings log + map files.
                                           #      Rides the workspace bind mount
                                           #      like logs/video, so it
                                           #      survives the container.
    export_min_interval_s: 5.0             # [RO] map files rewritten at most
                                           #      this often while the map
                                           #      changes, and always on disarm.
    http_port: 8093                        # [RO] GET-only downloads and /state.
                                           #      MUST differ from 8090 (ground
                                           #      station), 8091 (camera) and
                                           #      8092 (detector).
    bind_host: "0.0.0.0"                   # [RO] must NOT be 127.0.0.1 or the
                                           #      laptop cannot download.
    waypoint_alt_m: 10.0                   # [RO] .plan waypoint altitude: the
                                           #      colour-reading altitude.
    waypoint_hold_s: 6.0                   # [RO] .plan hover per buoy: longer
                                           #      than min_observe_s, with margin
                                           #      for arriving off-centre.
